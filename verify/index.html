<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify | Disc-Tools</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0d13">

    <link rel="icon" type="image/png" href="/static/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/static/assets/img/logo.png">

    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/fa-icons/fa.min.css">

    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .verify-box { width: min(440px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 28px; }
        .verify-box h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .verify-box .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .verify-box .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px; background: var(--blurple); color: #fff; border: none; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .verify-box .login-btn:hover { background: var(--blurple-strong); }
        .verify-box .user-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
        .verify-box .user-row img { border-radius: 50%; object-fit: cover; }
        .verify-box .user-row strong { font-size: 15px; }
        .verify-box .user-row span { font-size: 12px; color: var(--text-muted); }
        .verify-box label.check-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 10px; transition: border-color 0.15s; }
        .verify-box label.check-row:hover { border-color: var(--blurple-soft); }
        .verify-box label.check-row input { margin-top: 2px; accent-color: var(--blurple); width: 16px; height: 16px; flex-shrink: 0; }
        .verify-box label.check-row .text { font-size: 14px; color: var(--text-muted); line-height: 1.4; }
        .verify-box label.check-row .text a { color: var(--blurple-soft); }
        .verify-box .submit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; background: var(--success); color: #fff; border: none; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s, opacity 0.2s; }
        .verify-box .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .verify-box .submit-btn:not(:disabled):hover { background: #3db87a; }
        .verify-box .success { text-align: center; padding: 16px 0; }
        .verify-box .success .icon { font-size: 48px; color: var(--success); margin-bottom: 12px; }
        .verify-box .error { padding: 12px; background: rgba(240,71,71,0.08); border: 1px solid rgba(240,71,71,0.25); border-radius: 10px; color: #f04747; font-size: 14px; margin-top: 12px; }
        .verify-box .error:empty { display: none; }
    </style>
</head>
<body>

<div class="verify-box" id="verifyBox">
    <h1>Verify your account</h1>
    <p class="sub">You need to verify before accessing certain features.</p>
    <div id="verifyContent"></div>
</div>

<script src="/static/js/authnav.js" defer></script>
<script>
(function () {
    'use strict';

    var box = document.getElementById('verifyContent');
    var redirect = new URLSearchParams(location.search).get('redirect') || '/';

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showLogin() {
        box.innerHTML =
            '<a href="/api/auth/login?redirect=' + encodeURIComponent('/verify/?redirect=' + encodeURIComponent(redirect)) + '" class="login-btn">' +
            '<i class="fa-brands fa-discord"></i> Login with Discord</a>';
    }

    function showForm(u) {
        var ext = u.avatar && u.avatar.startsWith('a_') ? 'gif' : 'webp';
        var avatarURL = u.avatar
            ? 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.' + ext + '?size=64'
            : '/static/assets/img/logo.png';

        box.innerHTML =
            '<div class="user-row">' +
            '<img src="' + avatarURL + '" alt="" width="40" height="40">' +
            '<div><strong>' + esc(u.global_name || u.username) + '</strong><br>' +
            '<span>@' + esc(u.username) + '</span></div>' +
            '</div>' +
            '<label class="check-row"><input type="checkbox" id="cbTos">' +
            '<span class="text">I accept the <a href="/legal/terms-of-service/" target="_blank">Terms of Service</a></span></label>' +
            '<label class="check-row"><input type="checkbox" id="cbPrivacy">' +
            '<span class="text">I accept the <a href="/legal/privacy-policy/" target="_blank">Privacy Policy</a></span></label>' +
            '<button class="submit-btn" id="submitBtn" disabled>' +
            '<i class="fa-solid fa-shield-halved"></i> Verify</button>' +
            '<div class="error" id="verifyError"></div>';

        var cbTos = document.getElementById('cbTos');
        var cbPrivacy = document.getElementById('cbPrivacy');
        var submitBtn = document.getElementById('submitBtn');
        var verifyError = document.getElementById('verifyError');

        function updateSubmit() {
            submitBtn.disabled = !cbTos.checked || !cbPrivacy.checked;
        }
        cbTos.addEventListener('change', updateSubmit);
        cbPrivacy.addEventListener('change', updateSubmit);

        submitBtn.addEventListener('click', function () {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            verifyError.textContent = '';

            fetch('/api/verify/complete', { method: 'POST', credentials: 'include' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.success) {
                        if (data.alreadyVerified) {
                            box.innerHTML = '<div class="success"><div class="icon"><i class="fa-solid fa-circle-check"></i></div><h2>Already verified</h2><p style="color:var(--text-muted);margin-top:4px">You are already verified.</p><p style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);opacity:0.6;margin-top:16px">Redirecting in <span id="countdown">5</span> seconds&hellip;</p></div>';
                        } else {
                            box.innerHTML = '<div class="success"><div class="icon"><i class="fa-solid fa-circle-check"></i></div><h2>Verified!</h2><p style="color:var(--text-muted);margin-top:4px">Your account has been verified.</p><p style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);opacity:0.6;margin-top:16px">Redirecting in <span id="countdown">5</span> seconds&hellip;</p></div>';
                        }
                        var c = 5;
                        var cd = document.getElementById('countdown');
                        setInterval(function () { c--; if (c >= 0 && cd) cd.textContent = c; }, 1000);
                        setTimeout(function () { window.location.href = redirect; }, 5000);
                    } else {
                        verifyError.textContent = data.error || 'Verification failed. Please try again.';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Verify';
                    }
                })
                .catch(function (err) {
                    verifyError.textContent = 'Network error. Please try again.';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Verify';
                });
        });
    }

    fetch('/api/auth/me', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.authenticated) {
                showForm(data.user);
            } else {
                showLogin();
            }
        })
        .catch(function () {
            showLogin();
        });
})();
</script>

<script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
</body>
</html>
