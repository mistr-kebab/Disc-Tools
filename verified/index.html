<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verified | Disc-Tools</title>
    <meta name="keywords" content="discord verified, discord checkmark, discord verified badge, discord verification">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0d13">
    <link rel="icon" type="image/png" href="/static/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/static/assets/img/logo.png">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/fa-icons/fa.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .verify-box { text-align: center; padding: 48px 32px; }
        .verify-box .icon { font-size: 72px; color: var(--success); margin-bottom: 20px; animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes popIn { 0% { transform:scale(0); opacity:0 } 50% { transform:scale(1.2) } 100% { transform:scale(1); opacity:1 } }
        .verify-box h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: 8px; animation: fadeUp 0.4s 0.2s both; }
        .verify-box p { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; animation: fadeUp 0.4s 0.3s both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
        .verify-box .btns { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fadeUp 0.4s 0.4s both; }
        .verify-box .btns a { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 24px; border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; min-width: 200px; transition: border-color 0.15s, background 0.15s; }
        .verify-box .btns a:hover { border-color: var(--blurple); background: rgba(88,101,242,0.08); }
    </style>
</head>
<body>
    <div class="verify-box">
        <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
        <h1>You're verified!</h1>
        <p>You can close this tab and return to Discord.</p>
        <div class="btns">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            <a href="/tools/"><i class="fa-solid fa-bolt"></i> Browse Tools</a>
        </div>
    </div>
<script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
</body>
</html>
