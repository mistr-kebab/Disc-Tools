        <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { max-width: 600px; text-align: center; }
        .box .icon { font-size: 48px; color: var(--blurple); margin-bottom: 16px; }

        .box .desc { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
        .box .syntax-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; margin-bottom: 16px; }
        .box .syntax-block .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.08em; margin-bottom: 8px; }
        .box .syntax-block code { font-family: var(--font-mono); font-size: 15px; color: var(--blurple-soft); }
        .box .result-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; margin-bottom: 16px; }
        .box .result-block .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.08em; margin-bottom: 8px; }
        .box .note { color: var(--text-muted); font-size: 13px; margin-top: 24px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; }
        .box .note code { font-family: var(--font-mono); font-size: 12px; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; }
        .box .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 24px; transition: color 0.15s; }
        .box .back:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="box">
        <a href="/tips/formatting/" class="back"><i class="fa-solid fa-arrow-left"></i> All Formatting Tips</a>
        <div class="icon"><i class="fa-solid fa-hashtag"></i></div>
        <h1>Channel Mention</h1>
        <p class="desc">Link to a channel by its ID so others can click to jump there.</p>
        <div class="syntax-block">
            <div class="label"><i class="fa-solid fa-keyboard"></i> Syntax</div>
            <code><#channel_id></code>
        </div>
        <div class="result-block">
            <div class="label"><i class="fa-solid fa-eye"></i> Result</div>
            <div><span style="background:rgba(88,101,242,0.12);color:var(--blurple-soft);padding:1px 6px;border-radius:4px">#general</span></div>
        </div>
        <div class="note">You can get a channel ID by enabling Developer Mode in Discord settings and right-clicking a channel.</div>
    </div>
