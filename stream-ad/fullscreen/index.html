<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disc-Tools Fullscreen Ad — 1920x1080</title>
<link rel="stylesheet" href="/static/fa-icons/fa.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: Inter, system-ui, -apple-system, sans-serif;
}
body { position: relative; }
#overlay {
    position: absolute;
    inset: 0;
    width: 1920px; height: 1080px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
}
#overlay.visible { opacity: 1; }

/* top center text */
#top-bar {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 14px 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    max-width: 90vw;
    white-space: nowrap;
}
#top-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(88,101,242,0.5), transparent);
    border-radius: 999px;
}
#top-logo {
    width: 38px; height: 38px;
    border-radius: 9px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(88,101,242,0.4));
}
#top-text {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.45);
    line-height: 1;
    min-width: 320px;
}
#top-text.typing::after {
    content: '▌';
    display: inline-block;
    margin-left: 4px;
    color: #5865F2;
    font-weight: 400;
    animation: blink 0.9s step-end infinite;
}
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

/* bottom right QR with logo */
#qr-wrap {
    position: absolute;
    bottom: 32px;
    right: 32px;
    width: 198px;
    height: 198px;
    background: #fff;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.38);
    display: flex;
    align-items: center;
    justify-content: center;
}
#qr {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; border-radius: 10px; }
#qr-logo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #fff;
    padding: 5px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.22);
    object-fit: contain;
}
#qr-caption {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #fff;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.1);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* bottom left Advertisement */
#ad-label {
    position: absolute;
    bottom: 32px;
    left: 32px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    line-height: 1;
}

/* socials - left side vertical, each as own card - bigger */
#socials {
    position: absolute;
    left: 32px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
}
#socials a {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1;
    white-space: nowrap;
    background: rgba(0,0,0,0.68);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 16px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}
#socials a i {
    width: auto; height: auto;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    color: #5865F2;
    font-size: 24px;
    flex-shrink: 0;
}

/* countdown bar */
#progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 6px;
    background: #5865F2;
    width: 0%;
    transition: width 0.3s linear;
    opacity: 0.95;
    box-shadow: 0 -1px 6px rgba(88,101,242,0.5);
}
</style>
</head>
<body>
<div id="overlay">
    <div id="top-bar">
        <img id="top-logo" src="/static/assets/img/logo.png" alt="" onerror="this.style.display='none'">
        <div id="top-text"></div>
    </div>

    <div id="qr-wrap">
        <div id="qr"></div>
        <img id="qr-logo" src="/static/assets/img/logo.png" alt="Disc-Tools">
        <div id="qr-caption">disc-tools.de</div>
    </div>

    <div id="socials">
        <a href="https://discord.gg/rtRs8rhj5u" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> discord.gg/rtRs8rhj5u</a>
        <a href="https://www.instagram.com/disc.tools" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> @disc.tools</a>
        <a href="https://www.tiktok.com/@disc.tools" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok"></i> @disc.tools</a>
        <a href="https://x.com/disc_tools" target="_blank" rel="noopener"><i class="fa-brands fa-x-twitter"></i> @disc_tools</a>
    </div>

    <div id="ad-label">Advertisement</div>
    <div id="progress"></div>
</div>

<script src="/static/js/qrcode.min.js"></script>
<script>
const messages = [
    '12 free Discord tools — no download',
    'Decode snowflakes in one click',
    'Embed Builder — drag, drop, copy JSON',
    'Avatar CDN — every size & format',
    '<i class="fa-solid fa-wrench"></i> Webhook Manager — no bot needed',
    'Join discord.gg/rtRs8rhj5u',
    'disc-tools.de — try it now'
];

function getParam(name, fallback){
    const v = new URLSearchParams(location.search).get(name);
    return v === null ? fallback : v;
}
function clampInt(v, min, max, def){
    const n = parseInt(v, 10);
    if(isNaN(n)) return def;
    return Math.max(min, Math.min(max, n));
}
const cfg = {
    interval: clampInt(getParam('interval', '1800000'), 10000, 24*60*60*1000, 1800000),
    duration: clampInt(getParam('duration', '28000'), 5000, 120000, 28000),
    topInterval: clampInt(getParam('topInterval', '2800'), 1200, 8000, 2800),
    initialDelay: clampInt(getParam('initialDelay', '3000'), 0, 60000, 3000),
    always: getParam('always', null) !== null || getParam('preview', null) !== null,
    test: getParam('test', null) !== null
};
if(cfg.test){ cfg.interval = 15000; cfg.duration = 9000; cfg.initialDelay = 1000; }

const overlay = document.getElementById('overlay');
const topText = document.getElementById('top-text');
const progress = document.getElementById('progress');

// QR
try{
    const qrEl = document.getElementById('qr');
    if(qrEl && window.QRCode){
        qrEl.innerHTML = '';
        new QRCode(qrEl, {
            text: 'https://disc-tools.de',
            width: 144,
            height: 144,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    }
}catch(e){ document.getElementById('qr-wrap').style.display='none'; }

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function typeWriter(el, html, speed=30){
    el.innerHTML = '';
    el.classList.add('typing');
    let pos=0;
    while(pos < html.length){
        if(html[pos]==='<'){
            const end = html.indexOf('>', pos);
            if(end===-1){ el.innerHTML+=html[pos++]; }
            else { el.innerHTML+=html.slice(pos,end+1); pos=end+1; }
        } else if(html[pos]==='&'){
            const semi=html.indexOf(';',pos);
            if(semi!==-1 && semi-pos<10){ el.innerHTML+=html.slice(pos,semi+1); pos=semi+1; }
            else { el.innerHTML+=html[pos++]; }
            await sleep(speed);
        } else { el.innerHTML+=html[pos++]; await sleep(speed); }
    }
    el.classList.remove('typing');
}
function buildPrefixes(html){
    const p=[]; let cur=''; let pos=0;
    while(pos<html.length){
        if(html[pos]==='<'){ const end=html.indexOf('>',pos); if(end===-1){cur+=html[pos++];} else{cur+=html.slice(pos,end+1); pos=end+1;} p.push(cur); }
        else if(html[pos]==='&'){ const semi=html.indexOf(';',pos); if(semi!==-1&&semi-pos<10){cur+=html.slice(pos,semi+1); pos=semi+1;} else{cur+=html[pos++];} p.push(cur);}
        else{ cur+=html[pos++]; p.push(cur); }
    }
    return p;
}
async function eraseWriter(el, html, speed=16){
    const prefixes=buildPrefixes(html);
    el.classList.add('typing');
    for(let i=prefixes.length-1;i>=0;i--){
        el.innerHTML=prefixes[i];
        const chunk=prefixes[i].slice(prefixes[i-1]?.length||0);
        await sleep(chunk.startsWith('<')?0:speed);
    }
    el.innerHTML='';
    el.classList.remove('typing');
}

let textIdx=0;
let textRunning=false;
async function textCycle(){
    if(textRunning) return;
    textRunning=true;
    while(overlay.classList.contains('visible')){
        const msg=messages[textIdx % messages.length];
        await typeWriter(topText, msg, 34);
        await sleep(cfg.topInterval);
        await eraseWriter(topText, msg, 16);
        await sleep(380);
        textIdx=(textIdx+1)%messages.length;
    }
    textRunning=false;
}

function showOverlay(){
    overlay.classList.add('visible');
    progress.style.transition='none';
    progress.style.width='0%';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
        progress.style.transition=`width ${cfg.duration}ms linear`;
        progress.style.width='100%';
    }));
    textCycle();
}
function hideOverlay(){
    overlay.classList.remove('visible');
    progress.style.width='0%';
}

let cycleTimer=null;
function schedule(){
    if(cfg.always){
        showOverlay();
        return;
    }
    setTimeout(()=>{
        showOverlay();
        setTimeout(()=>{
            hideOverlay();
            cycleTimer=setInterval(()=>{
                showOverlay();
                setTimeout(hideOverlay, cfg.duration);
            }, cfg.interval);
        }, cfg.duration);
    }, cfg.initialDelay);
}
schedule();
</script>
</body>
</html>
