<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Suspended | Disc-Tools</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0d13">

    <link rel="icon" type="image/png" href="/static/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/static/assets/img/logo.png">

    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/fa-icons/fa.min.css">

    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .blocked-box { position: relative; max-width: 420px; }
        .blocked-box .icon { width: 96px; height: 96px; background: rgba(240,71,71,0.1); color: #f04747; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; position: relative; }
        .blocked-box .icon i { animation: swing 2s ease-in-out infinite; transform-origin: 70% 80%; }
        @keyframes swing { 0%,100% { transform:rotate(0deg) } 25% { transform:rotate(-15deg) } 75% { transform:rotate(10deg) } }
        .blocked-box h1 { font-size: clamp(1.6rem, 4vw, 2rem); margin-bottom: 8px; }
        .blocked-box h1 em { color: #f04747; font-style: normal; }
        .blocked-box p { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .blocked-box .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 12px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; background: var(--blurple); color: #fff; transition: background 0.2s; }
        .blocked-box .btn:hover { background: var(--blurple-strong); }
        .blocked-box .footer-note { font-size: 11px; color: var(--text-muted); opacity: 0.4; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="blocked-box">
        <div class="icon"><i class="fa-solid fa-gavel"></i></div>
        <h1>You got <em>suspended</em></h1>
        <p>Your account has been suspended. If you believe this is a mistake, reach out on Discord.</p>
        <a href="https://discord.gg/rtRs8rhj5u" class="btn"><i class="fa-brands fa-discord"></i> Contact Support</a>
        <p class="footer-note">disc-tools.de</p>
    </div>
<script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
</body>
</html>
